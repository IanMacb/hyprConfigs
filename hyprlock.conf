$font = Monospace

# BACKGROUND
background {
    monitor =
    # path = /home/ian/Pictures/Wallpapers/IfYW4yDc.png
    path = ~/.config/hypr/wallpaper.link
    blur_passes = 2
    # contrast = 0.8916
    # brightness = 0.8916
    # vibrancy = 0.8916
    # vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    disable_loading_bar = false
    ignore_empty_input = true
}

