# Time
label {
    monitor =
    # text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    text = $TIME
    color = rgba(255, 255, 255, 0.8)
    font_size = 60
    font_family = $font
    shadow_passes = 1
    shadow_boost = 0.4
    position = 0, -8
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A %d %B")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 19
    font_family = $font
    shadow_passes = 1
    shadow_boost = 0.4
    position = 0, -60
    halign = center
    valign = center
}

