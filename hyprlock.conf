# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    rounding = 2
    outline_thickness = 2
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.6)
    font_color = black
    fade_on_empty = false
    font_family = $font
    placeholder_text = 
    hide_input = false
    fail_text = $PAMFAIL

    position = 0, -20%
    halign = center
    valign = center
}

# Reboot
label {
    monitor =
    text = <span> 󰜉 </span>
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = $font
    onclick = systemctl reboot now
    position = -200, 100
    halign = center
    valign = bottom
}

# Power off
label {
    monitor =
    text = <span> 󰐥 </span>
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = $font
    onclick = systemctl shutdown now
    position = 0, 100
    halign = center 
    valign = bottom
}

# Suspend
label {
    monitor =
    text = <span> 󰤄 </span>
    color = rgba(255, 255, 255, 0.6)
    font_size = 50
    font_family = $font
    onclick = systemctl suspend
    position = 200, 100
    halign = center
    valign = bottom
}